name: Helm Publish

on:
  push:
    branches: [main]
    paths:
      - "charts/octelium/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: helm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read chart metadata
        id: chart
        run: |
          set -euo pipefail
          meta="$(helm show chart charts/octelium)"
          name="$(printf '%s\n' "$meta" | awk '/^name:/ {print $2; exit}')"
          version="$(printf '%s\n' "$meta" | awk '/^version:/ {print $2; exit}')"
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::could not read name/version from charts/octelium/Chart.yaml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart: $name $version"

      - name: Lint
        run: helm lint charts/octelium

      - name: Template smoke test
        run: |
          helm template charts/octelium \
            --set octelium.domain=example.com \
            --set octelium.authToken=dummy > /dev/null

      - name: Check if already published
        id: exists
        run: |
          set -euo pipefail
          ref="oci://ghcr.io/${{ github.repository_owner }}/helm-charts/${{ steps.chart.outputs.name }}"
          if helm show chart "$ref" --version "${{ steps.chart.outputs.version }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        id: push
        if: steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          helm package charts/octelium --destination dist
          out="$(helm push \
            "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/helm-charts" 2>&1)"
          echo "$out"
          digest="$(printf '%s\n' "$out" | awk '/[Dd]igest:/ {print $NF; exit}')"
          if [ -z "$digest" ]; then
            echo "::error::could not determine pushed digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart (keyless cosign)
        if: steps.exists.outputs.published == 'false'
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign \
            "ghcr.io/${{ github.repository_owner }}/helm-charts/${{ steps.chart.outputs.name }}@${{ steps.push.outputs.digest }}"
          echo "Published and signed ${{ steps.chart.outputs.name }} ${{ steps.chart.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip (already published)
        if: steps.exists.outputs.published == 'true'
        run: |
          echo "${{ steps.chart.outputs.name }} ${{ steps.chart.outputs.version }} is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"