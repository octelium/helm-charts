name: Sync appVersion

permissions: {}

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [octelium-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Octelium version to pin, e.g. 0.42.0. Empty uses the latest release."
        required: false
        type: string
      dry-run:
        description: "Resolve and render the change without committing it"
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-app-version
  cancel-in-progress: false

env:
  CHART_DIR: charts/octelium
  UPSTREAM_REPO: octelium/octelium
  CLIENT_IMAGE: ghcr.io/octelium/octelium
  HELM_VERSION: v3.19.0
  # Capped by the releases.json bundled in the pinned setup-oras action.
  ORAS_VERSION: 1.3.3

jobs:
  sync:
    name: Sync the Octelium client version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      actions: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Resolve the target version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail

          requested="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          if [ -z "$requested" ]; then
            requested="$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq '.tagName')"
          fi

          target="${requested#v}"
          if ! printf '%s' "$target" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$requested\" is not a stable release version"
            exit 1
          fi

          current="$(helm show chart "$CHART_DIR" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2; exit}')"
          chart_version="$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2; exit}')"

          {
            echo "target=$target"
            echo "current=$current"
            echo "chart_version=$chart_version"
          } >> "$GITHUB_OUTPUT"

          if [ "$target" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on $current. Nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updating $current -> $target"
          fi

      - name: Check the image exists
        if: steps.resolve.outputs.changed == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image="$CLIENT_IMAGE:$TARGET"
          if ! oras manifest fetch --descriptor "$image" > /dev/null; then
            echo "::error::$image is not published yet"
            exit 1
          fi
          echo "Verified $image"

      - name: Update the chart
        id: update
        if: steps.resolve.outputs.changed == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          CHART_VERSION: ${{ steps.resolve.outputs.chart_version }}
        run: |
          set -euo pipefail

          next_chart_version="$(printf '%s' "$CHART_VERSION" | awk -F. '{print $1 "." $2 "." $3 + 1}')"
          if ! printf '%s' "$next_chart_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=$CHART_DIR/Chart.yaml::cannot bump chart version \"$CHART_VERSION\""
            exit 1
          fi

          awk \
            -v app_version="$TARGET" \
            -v chart_version="$next_chart_version" \
            -v previous="$CURRENT" \
            -v image="$CLIENT_IMAGE" '
            BEGIN { in_changes = 0 }
            in_changes == 1 {
              if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^    /) { next }
              in_changes = 0
            }
            /^version:/ && !seen_version { print "version: " chart_version; seen_version = 1; next }
            /^appVersion:/ && !seen_app { print "appVersion: \"" app_version "\""; seen_app = 1; next }
            $0 ~ ("^[[:space:]]+image: " image ":") {
              sub(/:[^:]*$/, ":" app_version)
              print
              next
            }
            /^  artifacthub\.io\/changes: \|/ {
              print
              print "    - kind: changed"
              print "      description: Updated the Octelium client from " previous " to " app_version
              in_changes = 1
              next
            }
            { print }
          ' "$CHART_DIR/Chart.yaml" > "$CHART_DIR/Chart.yaml.new"

          mv "$CHART_DIR/Chart.yaml.new" "$CHART_DIR/Chart.yaml"

          echo "chart_version=$next_chart_version" >> "$GITHUB_OUTPUT"
          echo "::group::Chart.yaml"
          cat "$CHART_DIR/Chart.yaml"
          echo "::endgroup::"

      - name: Verify the updated chart
        if: steps.resolve.outputs.changed == 'true'
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          NEXT_CHART_VERSION: ${{ steps.update.outputs.chart_version }}
        run: |
          set -euo pipefail
          meta="$(helm show chart "$CHART_DIR")"
          got_app="$(printf '%s\n' "$meta" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2; exit}')"
          got_chart="$(printf '%s\n' "$meta" | awk '/^version:/ {print $2; exit}')"

          [ "$got_app" = "$TARGET" ] || { echo "::error::appVersion is $got_app, expected $TARGET"; exit 1; }
          [ "$got_chart" = "$NEXT_CHART_VERSION" ] || { echo "::error::chart version is $got_chart, expected $NEXT_CHART_VERSION"; exit 1; }

          annotated="$(awk -v image="$CLIENT_IMAGE" '$0 ~ ("^[[:space:]]+image: " image ":") {sub(/.*:/, ""); print; exit}' "$CHART_DIR/Chart.yaml")"
          [ "$annotated" = "$TARGET" ] || { echo "::error::the artifacthub.io/images annotation pins $annotated, expected $TARGET"; exit 1; }

          helm lint --strict "$CHART_DIR" -f "$CHART_DIR/ci/default-values.yaml"
          for values in "$CHART_DIR"/ci/*-values.yaml; do
            helm template release "$CHART_DIR" -f "$values" > /dev/null
          done

      - name: Commit and push
        id: commit
        if: steps.resolve.outputs.changed == 'true' && inputs.dry-run != true
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          NEXT_CHART_VERSION: ${{ steps.update.outputs.chart_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_DIR/Chart.yaml"

          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
            exit 0
          fi

          git commit \
            -m "chore: update Octelium to $TARGET" \
            -m "Bumps appVersion from $CURRENT to $TARGET and the chart version to $NEXT_CHART_VERSION."
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the publish workflow
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run helm-publish.yml --ref "$GITHUB_REF_NAME"

      - name: Summary
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          CHANGED: ${{ steps.resolve.outputs.changed }}
          NEXT_CHART_VERSION: ${{ steps.update.outputs.chart_version }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          set -euo pipefail
          {
            if [ "$CHANGED" != "true" ]; then
              echo "Already on Octelium \`$CURRENT\`. Nothing to do."
            elif [ "$PUSHED" = "true" ]; then
              echo "Updated Octelium \`$CURRENT\` -> \`$TARGET\` and released chart \`$NEXT_CHART_VERSION\`."
            else
              echo "Dry run: would update Octelium \`$CURRENT\` -> \`$TARGET\` as chart \`$NEXT_CHART_VERSION\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
