{{- if .Values.service.enabled }}
{{- $ports := include "octelium.servicePorts" . | trim }}
{{- if not (or $ports .Values.service.extraPorts) }}
{{- fail "service.enabled is true but no port is exposed. Add entries to octelium.publish or service.extraPorts, or enable octelium.essh or octelium.esocks5" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "octelium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octelium.labelsWith" (dict "ctx" . "extra" .Values.service.labels) | nindent 4 }}
  {{- with (include "octelium.annotationsWith" (dict "ctx" . "extra" .Values.service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . | quote }}
  {{- end }}
  {{- if has .Values.service.type (list "LoadBalancer" "NodePort") }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "octelium.selectorLabels" . | nindent 4 }}
  ports:
    {{- with $ports }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with .Values.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
